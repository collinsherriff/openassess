<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenAssess — Free tools for teachers</title>
  <meta name="description" content="A free, education-only toolkit for the whole assessment lifecycle: PDF→QTI, format conversion, an item bank, quiz delivery, reports and more. No paywalls, runs in your browser." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Client-side libraries (loaded from CDN, cached) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="OpenAssess home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="4.5"/>
          <path d="m8 12.5 3 3L16.5 9"/>
        </svg>
      </span>
      <span class="brand-text">OpenAssess</span>
    </a>
    <nav class="topnav" aria-label="Primary">
      <a href="#/tools">Tools</a>
      <a href="#/bank">Item Bank</a>
      <a href="#/about">About</a>

  <footer class="footer">

      <strong>OpenAssess</strong> — made for teachers, free for good. Everything runs in your browser.
    </div>
    <div class="footer-links">
      <a href="#/about">About</a>
      <a href="#/privacy">Privacy</a>
      <a href="https://github.com/collinsherriff/openassess" target="_blank" rel="noopener">Source</a>

  <script type="module" src="js/app.js"></script>
